services:
  jubbio-security:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - jubbio_data:/data
    networks:
      - relay_net
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  decoy:
    profiles: ["decoy"]
    build:
      context: .
      dockerfile: Dockerfile.decoy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - decoy_data:/decoy-data
    networks:
      - decoy_net
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
volumes:
  jubbio_data:
  decoy_data:
networks:
  relay_net:
  decoy_net:
