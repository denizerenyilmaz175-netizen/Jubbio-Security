name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++
        run: cmake --build build --parallel 2
      - name: Test C++
        run: ctest --test-dir build --output-on-failure
      - name: Check Rust bridge boundary
        run: cargo check --manifest-path rust/libsignal_bridge/Cargo.toml
